<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>Pesquisa Culturama</title>
  </head>
  <body>
    <header>
      <h1>Pesquisa Online</h1>
    </header>
    <section>
      <form action="" method="get">
        <fieldset>
          <legend>Dados pessoais</legend>
          
          <label for="name">Nome</label>
          <input id="name" name="userName" required />
          <br />
          <label for="age">Idade</label>
          <input id="age" name="userAge" min="12" max="100" />
          <br />
          <label for="birth">Data Nascimento</label>
          <input id="birth" type="date" name="userBirth" />
          <br />
          <label for="email">E-mail</label>
          <input id="email" name="userEmail" required />
          <br />
          <label for="phoneNumber">Telefone</label>
          <input id="phoneNumber"
            type="tel"
            name="userPhoneNumber"
            pattern="[0-9]{11}"
            placeholder="DDD+number no espace or hifen"
          />
          <br />
          <label for="image">Upload de foto</label>
          <input id="image" type="file" accept="image/*" name="userImage">
          <br>
        </fieldset> 
        <fieldset>
          <legend>Perfil</legend>
          <p>Gênero:</p>
          <input id="famale" type="radio" name="userGender" id="Feminino" />
          <label for="famale">Feminino</label>

          <input id="male" type="radio" name="userGender" id="Masculino" />
          <label for="male">Masculino</label>

          <input id="undefined" type="radio" name="userGender" id="notInformed" />
          <label for="undefined">Prefiro não informar</label>
          <br>

          <label for="status">Estado civil</label>
          <select id="status" name="maritalStatus">
            <option id="notInformed">Selecione...</option>
            <option id="casado">Casado</option>
            <option id="solteiro">Solteiro</option>
          <option id="divorciado">Divorciado</option>          
          <option id="casado">União estável</option>
          </select>
          <br>

          <label for="state">Estado</label>
          <select id="state" name="userState" required></option>
            <option id="acre">Acre</option>
            <option id="alagoas">Alagoas</option>
            <option id="amapa">Amapá</option>
            <option id="amazonas">Amazonas</option>
            <option id="bahia">Bahia</option>
            <option id="ceara">Ceará</option>
            <option id="distritoFederal">Distrito Federal</option>
            <option id="espiritoSanto">Espirito Santo</option>
            <option id="goias">Goiás</option>
            <option id="maranhao">Maranhão</option>
            <option id="matoGrossoDoSul">Mato Grosso do Sul</option>
            <option id="matoGrosso">Mato Grosso</option>
            <option id="minasGerais">Minas Gerais</option>
            <option id="para">Pará</option>
            <option id="paraiba">Paraíba</option>
            <option id="parana">Paraná</option>
            <option id="pernambuco">Pernambuco</option>
            <option id="piaui">Piauí</option>
            <option id="rioDeJaneiro">Rio de Janeiro</option>
            <option id="rioGrandeDoNorte">Rio Grande do Norte</option>
            <option id="rioGrandeDoSul">Rio Grande do Sul</option>
            <option id="rondonia">Rondônia</option>
            <option id="roraima">Roraima</option>
            <option id="santaCatarina">Santa Catarina</option>
            <option id="saoPaulo">São Paulo</option>
            <option id="sergipe">Sergipe</option>
            <option id="tocantins">Tocantins            
          </select>

          <label for="city">Cidade</label>
          <input id="city" type="text" name="userCity">

        </fieldset>

        <fieldset>
          <legend>Hábitos</legend>
          <p>Redes sociais:</p>
          <input id="instagram" type="checkbox" name="social" id="instagram">
          <label for="instagram">instagram</label><br>
          <input id="facebook" type="checkbox" name="social" id="facebook">
          <label for="facebook">Facebook</label><br>
          <input id="linkedin" type="checkbox" name="social" id="linkedin">
          <label for="linkedin">LinkedIn</label><br>
          <input id="x" type="checkbox" name="social" id="x">
          <label for="x">X</label><br>

          <label for="musicStyle">Estilos musicais:</label>
          <input type="text" name="userMusicStyle" id="musicStyle" list="musicList">
          <datalist id="musicList">
            <option id="Rock">
            <option id="Pop">
            <option id="Sertanejo">
            <option id="Pagode">
            <option id="Samba">
            <option id="Hard_punk">
          </datalist>
          <label for="color">Cor favorita:</label>
          <input type="color" name="userFavoriteColor" id="color">
        </fieldset>

        <fieldset>
          <legend>Opnião</legend>
          <p>O que você achou da qualidade do nosso serviço:</p>
          <input type="radio" name="userOpnion" id="greatOpnion">
          <label for="greatOpnion">Ótimo</label><br>
          <input type="radio" name="userOpnion" id="goodOpnion">
          <label for="goodOpnion">Boa</label><br>
          <input type="radio" name="userOpnion" id="normalOpnion">
          <label for="normalOpnion">Regular</label><br>
          <input type="radio" name="userOpnion" id="badOpnion">
          <label for="badOpnion">Ruim</label><br>
          <label for="suggest">Digite aqui sua opinião;</label><br>
          <textarea name="userOpnion" id="suggest">Digite aqui...</textarea>
        </fieldset>
        <button type="submit">Enviar</button>
      </form>
    </section>
  </body>
</html>
