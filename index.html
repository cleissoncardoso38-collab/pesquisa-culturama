<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>Pesquisa Culturama</title>
  </head>
  <body>
    <header>
      <h1>Pesquisa Online</h1>
    </header>
    <section>
      <form action="" method="get">
        <fieldset>
          <legend>Dados pessoais</legend>
          
          <label for="name">Nome</label>
          <input id="name" name="userName" required />
          <br />
          <label for="age">Idade</label>
          <input id="age" name="userAge" min="12" max="100" />
          <br />
          <label for="birth">Data Nascimento</label>
          <input id="birth" type="date" name="userBirth" />
          <br />
          <label for="email">E-mail</label>
          <input id="email" name="userEmail" required />
          <br />
          <label for="phoneNumber">Telefone</label>
          <input id="phoneNumber"
            type="tel"
            name="userPhoneNumber"
            pattern="[0-9]{11}"
            placeholder="DDD+number no espace or hifen"
          />
          <br />
          <label for="image">Upload de foto</label>
          <input id="image" type="file" accept="image/*" name="userImage">
          <br>
        </fieldset> 
        <fieldset>
          <legend>Perfil</legend>
          <p>Gênero:</p>
          <input id="famale" type="radio" name="userGender" value="Feminino" />
          <label for="famale">Feminino</label>

          <input id="male" type="radio" name="userGender" value="Masculino" />
          <label for="male">Masculino</label>

          <input id="undefined" type="radio" name="userGender" value="notInformed" />
          <label for="undefined">Prefiro não informar</label>
          <br>

          <label for="status">Estado civil</label>
          <select id="status" name="maritalStatus">
            <option value="notInformed">Selecione...</option>
            <option value="casado">Casado</option>
            <option value="solteiro">Solteiro</option>
          <option value="divorciado">Divorciado</option>          
          <option value="casado">União estável</option>
          </select>
          <br>

          <label for="state">Estado</label>
          <select id="state" name="userState" required></option>
            <option value="acre">Acre</option>
            <option value="alagoas">Alagoas</option>
            <option value="amapa">Amapá</option>
            <option value="amazonas">Amazonas</option>
            <option value="bahia">Bahia</option>
            <option value="ceara">Ceará</option>
            <option value="distritoFederal">Distrito Federal</option>
            <option value="espiritoSanto">Espirito Santo</option>
            <option value="goias">Goiás</option>
            <option value="maranhao">Maranhão</option>
            <option value="matoGrossoDoSul">Mato Grosso do Sul</option>
            <option value="matoGrosso">Mato Grosso</option>
            <option value="minasGerais">Minas Gerais</option>
            <option value="para">Pará</option>
            <option value="paraiba">Paraíba</option>
            <option value="parana">Paraná</option>
            <option value="pernambuco">Pernambuco</option>
            <option value="piaui">Piauí</option>
            <option value="rioDeJaneiro">Rio de Janeiro</option>
            <option value="rioGrandeDoNorte">Rio Grande do Norte</option>
            <option value="rioGrandeDoSul">Rio Grande do Sul</option>
            <option value="rondonia">Rondônia</option>
            <option value="roraima">Roraima</option>
            <option value="santaCatarina">Santa Catarina</option>
            <option value="saoPaulo">São Paulo</option>
            <option value="sergipe">Sergipe</option>
            <option value="tocantins">Tocantins            
          </select>

          <label for="city">Cidade</label>
          <input id="city" type="text" name="userCity">

        </fieldset>

        <fieldset>
          <legend>Hábitos</legend>
          <p>Redes sociais:</p>
          <input id="instagram" type="checkbox" name="social" id="instagram">
          <label for="instagram">instagram</label><br>
          <input id="facebook" type="checkbox" name="social" value="facebook">
          <label for="facebook">Facebook</label><br>
          <input id="linkedin" type="checkbox" name="social" value="linkedin">
          <label for="linkedin">LinkedIn</label><br>
          <input id="x" type="checkbox" name="social" value="x">
          <label for="x">X</label><br>

          <label for="musicStyle">Estilos musicais:</label>
          <input type="text" name="userMusicStyle" id="musicStyle" list="musicList">
          <datalist id="musicList">
            <option value="Rock">
            <option value="Pop">
            <option value="Sertanejo">
            <option value="Pagode">
            <option value="Samba">
            <option value="Hard_punk">
          </datalist>
          <label for="color">Cor favorita:</label>
          <input type="color" name="userFavoriteColor" id="color">
        </fieldset>

        <fieldset>
          <legend>Opnião</legend>
          <p>O que você achou da qualidade do nosso serviço:</p>
          <input type="radio" name="userOpnion" id="greatOpnion">
          <label for="greatOpnion">Ótimo</label><br>
          <input type="radio" name="userOpnion" id="goodOpnion">
          <label for="goodOpnion">Boa</label><br>
          <input type="radio" name="userOpnion" id="normalOpnion">
          <label for="normalOpnion">Regular</label><br>
          <input type="radio" name="userOpnion" id="badOpnion">
          <label for="badOpnion">Ruim</label><br>
          <label for="suggest">Digite aqui sua opinião;</label><br>
          <textarea name="userOpnion" id="suggest">Digite aqui...</textarea>
        </fieldset>

        <fieldset>
          <legend>Confirmações</legend>

          <input type="checkbox" name="userLgpd" id="userLgpdTerm" value="accepted" required>
          <label for="userLgpdTerm">Eu aceito participar da pesquisa</label><br>
          <input type="checkbox" name="userResult" id="getResult" value="accepted">
          <label for="getResult">Desejo receber o resultado por e-mail</label>

        </fieldset>
        <button type="submit">Enviar</button>
      </form>
    </section>
  </body>
</html>
